[project]
name = "alios"
version = "0.1.0"
description = "Open-source AI Operating System for autonomous agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core", "packages/runtime", "apps/api", "apps/cli"]

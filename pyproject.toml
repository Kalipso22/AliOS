[project]
name = "alios"
version = "0.1.0"
description = "Open-source AI Operating System for autonomous agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "pydantic-settings>=2.6,<3.0", "structlog>=24.4,<26.0", "uvicorn>=0.30,<1.0"]

[dependency-groups]
dev = ["black>=24.10,<26.0", "httpx>=0.27,<1.0", "mypy>=1.13,<2.0", "pre-commit>=4.0,<5.0", "pytest>=8.0,<9.0", "ruff>=0.6,<1.0"]

[tool.uv.workspace]
members = ["apps/api", "apps/cli", "packages/*", "sdk/python"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core", "packages/runtime", "apps/api", "apps/cli"]
addopts = "-q"
